<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>2FA Підтвердження</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #555; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #007bff; color: white; border: none; padding: 10px; margin-top: 20px; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0069d9; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Двофакторна автентифікація</h2>
        <p>Введіть код з вашого додатка (Google Authenticator).</p>
        <form action="/login/2fa" method="POST">
            <label>Код підтвердження:</label>
            <input type="text" name="code" required autofocus>
            <button type="submit">Підтвердити</button>
        </form>
    </div>
</body>
</html>
