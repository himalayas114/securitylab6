<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Реєстрація - Безпечна система</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #555; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #007bff; color: white; border: none; padding: 10px; margin-top: 20px; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .hint { font-size: 12px; color: #666; margin-top: 5px; }
        .links { text-align: center; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Реєстрація</h2>
        <form action="/register" method="POST">
            <label>Email:</label>
            <input type="email" name="email" required placeholder="user@example.com">

            <label>Пароль:</label>
            <input type="password" name="password" required placeholder="••••••••">
            <div class="hint">мін. 8 символів, великі/малі літери, цифра, спецсимвол</div>

            <label>CAPTCHA: Скільки буде 2 + 3?</label>
            <input type="text" name="captcha" required placeholder="Введіть відповідь">

            <button type="submit">Зареєструватися</button>
        </form>
        <div class="links">
            <a href="/login-page">Вже є акаунт? Увійти</a>
        </div>
    </div>
</body>
</html>
