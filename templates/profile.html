<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Профіль користувача</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 40px; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        h2 { color: #333; }
        .badge { background: #17a2b8; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .btn-danger { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; text-decoration: none; }
        .btn-danger:hover { background: #c82333; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Особистий кабінет</h2>
        <p><strong>Email:</strong> <span id="user-email">користувача</span></p>
        <p><strong>Роль:</strong> <span class="badge" id="user-role">user</span></p>
        <p><strong>Статус активації:</strong> <span id="user-status">Активовано</span></p>
        
        <div id="2fa-section">
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
            <h3>Двофакторна автентифікація (2FA)</h3>
            <p>Статус: <span id="2fa-status">Завантаження...</span></p>
            <div id="2fa-controls">
                <!-- Controls will be injected by JS -->
            </div>
            <div id="2fa-setup" style="display:none; margin-top: 15px;">
                <p>Відскануйте QR-код або введіть секрет вручну:</p>
                <p><strong>Секрет:</strong> <span id="2fa-secret"></span></p>
                <p><em>(Тут міг би бути QR-код: <span id="2fa-url"></span>)</em></p>
                <form id="enable-2fa-form">
                    <input type="text" id="2fa-code" placeholder="Введіть код" required style="width: auto;">
                    <button type="submit" style="background: #28a745; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Увімкнути</button>
                </form>
            </div>
        </div>

        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

        <a href="/login-page" class="btn-danger">Вийти з системи</a>
    </div>

    <script>
        // Check 2FA status and update UI
        // In a real app we'd fetch user data. Here we use endpoints we just created.
        async function loadProfile() {
             // We don't have a GET /profile JSON endpoint yet, but we can try to guess status 
             // Or just show 2FA setup if needed.
             // For simplicity, let's just add a button to "Manage 2FA"
             const controls = document.getElementById('2fa-controls');
             controls.innerHTML = '<button onclick="setup2FA()" style="padding: 8px 15px; border-radius: 4px; cursor: pointer;">Налаштувати 2FA</button>';
        }

        async function setup2FA() {
            const resp = await fetch('/2fa/setup');
            const data = await resp.json();
            if (data.secret) {
                document.getElementById('2fa-secret').innerText = data.secret;
                document.getElementById('2fa-url').innerText = data.otpauth_url;
                document.getElementById('2fa-setup').style.display = 'block';
            } else {
                alert(data.message || "Помилка");
            }
        }

        document.getElementById('enable-2fa-form').onsubmit = async (e) => {
            e.preventDefault();
            const code = document.getElementById('2fa-code').value;
            const formData = new FormData();
            formData.append('code', code);
            const resp = await fetch('/2fa/enable', {
                method: 'POST',
                body: formData
            });
            const data = await resp.json();
            alert(data.message);
            location.reload();
        };
        
        loadProfile();
    </script>
</body>
</html>
