<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід - Безпечна система</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #333; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #555; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #28a745; color: white; border: none; padding: 10px; margin-top: 20px; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #218838; }
        .links { text-align: center; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Вхід</h2>
        <form action="/login" method="POST">
            <label>Email:</label>
            <input type="email" name="email" required>

            <label>Пароль:</label>
            <input type="password" name="password" required>

            <button type="submit">Увійти</button>
        </form>
        <div style="margin-top: 10px;">
            <a href="/auth/login" style="display: block; text-align: center; background: #4285F4; color: white; padding: 10px; border-radius: 4px; text-decoration: none; font-size: 14px;">Sign in with Google</a>
        </div>
        <div class="links">
            <a href="/register-page">Зареєструватися</a> | <a href="/forgot-page">Забули пароль?</a>
        </div>
    </div>
</body>
</html>
